extends: ./scripts/release-changelog.js

git:
  commitMessage: 'release: Release version ${version}'
  tagAnnotation: 'Release version ${version}'
  tagName: 'v${version}'

npm:
  publish: false

plugins:
  '@release-it/conventional-changelog':
    infile: CHANGELOG.md
    context:
      repository: console-css

hooks:
  before:init:
    - pnpm lint:fix
    - pnpm typecheck
  after:init:
    - pnpm lint
    - pnpm test
