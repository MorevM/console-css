<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ConsoleCSS playground</title>
		<meta
			name="description"
			content="Try CSS-styled messages in the browser console."
		/>
	</head>
	<body>
		<p>Open the browser console to see the styled message.</p>

			import ConsoleCSS from '../src/index.ts';

		</script>
	</body>
